name: dashboard_shakhsi
description: A private, offline-first personal dashboard for finance, tasks, habits, and goals.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^17.3.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shamsi_date: ^1.1.1
  fl_chart: ^1.2.0
  path_provider: ^2.1.6
  file_picker: ^11.0.2
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.1
  uuid: ^4.6.0
  intl: ^0.20.2
  collection: ^1.19.1
  posix: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.34.2
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sqlite3: ^3.1.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/original_grain.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Variable.ttf
